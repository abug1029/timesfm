# pytest 配置（dead-code purge 2026-09-30 / spec §5.2，P1-5）
# testpaths：裸 pytest 只收集 tests/（实证：2026-09-30 裸 pytest 曾递归收集
# third_party 7 errors 中断，72.77s 白跑）
# norecursedirs：默认值 + archive（tests/archive 归档测试含失效 sys.path hack，
# 收集即 4 errors 中断）+ third_party + .venv
[pytest]
testpaths = tests
norecursedirs = .* build dist CVS _darcs {arch} *.egg archive third_party .venv
