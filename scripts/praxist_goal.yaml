# Praxist goal — 2026-09-11：预算已无限制；成功条件仍是 1 星集合 ≥4。
# Host: WSL2 Ubuntu-22.04 /home/abug/timesfm，8 vCPU / 7.7 GiB（不是 15GiB）。见 docs/host_environment_assessment.md
# Policy: 方案 A — peer 零 TimesFM；任何 TimesFM 仅慢环。mem_guard flock≤1 + MemAvailable<2.5GiB 仍绑定。
# 成功条件未改：1 星 {m,ss,sr,cj,jd,lh,eg,rb} 过门 ≥4（pass_variants = gate_pass 且 ev>0）。
# 2026-09-09 扩目标史：ss_vor 已过门，还需 3 个 1 星；n-不足近失误自动复测（cj_oi n=324）。
# 预算字段已改为 999999 / deadline 2099-12-31（下面数字即现行值）。
goal:
  success_condition:
    # 1 星品种集 = m/ss/sr/cj/jd/lh/eg/rb (见 task.yaml research_direction)；ss_vor 已占一席，还需 3 个。
    - "len(symbols_hit & {'m','ss','sr','cj','jd','lh','eg','rb'}) >= 4"
    - "min(pass_variant_pf_ratios) > 1.05"
    - "len(families_hit) >= 1"
  budgets:
    max_cycles: 999999  # 无限制（持续运行直到目标达成）
    cpu_hours: 999999  # 无限制
    # ~2.7M+/cycle observed；扩目标后 12+ cycles 余量。
    token_budget_m: 999999  # 无限制
    deadline: "2099-12-31"  # 无截止日期
  cadence:
    survivors_per_cycle: 3  # 慢环加压 2026-09-06：每周期最多 3 survivors
    aligned_max_points: 600  # 慢环加压：aligned 深度 600
    run_budget_hours: 1.5
    quota_window_hours: 5.0
    quota_margin_min: 30
    # n-不足型近失误 (gate 仅差 n：ic≥0.05, ev>0, pf/incumbent>1.05)：
    # 本地 1H 库有效点长到 ≥350 且比上次裁决多 ≥N 点时自动排队复测 (checkpoint resume，只算新点)。
    retest_min_new_points: 1
    # 慢环选座优先: 1 星目标品种 (其中当前 n>=350 的最先; cj/lh 样本暂不足次之; 2 星最后)。
    priority_symbols: [m, ss, sr, cj, jd, lh, eg, rb]
