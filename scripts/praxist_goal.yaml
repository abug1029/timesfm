# Praxist goal — 品种分级后的有界目标
# Host: WSL2 Ubuntu-22.04 /home/abug/timesfm
# 成功条件：每品种至少 1 个经 family 封账的确认变体
# 原方向准确率绝对门槛与 tier>=8 已退役，不再作为成功条件。
# Phase 3 的 multi_seed / decay 仍未实现，这里不设通过条件。

goal:
  success_condition:
    - "all_symbols_pass_phase1"

  phase_definitions:
    success: "每品种至少 1 个经 family 封账的确认变体。这是文档，不是另一套求值式。真判据只有 all_symbols_pass_phase1，即该品种档位为可预测。"
    retired: "原 Phase 1 的方向准确率绝对门槛与 tier>=8 已退役，不再作为成功条件。"
    phase3: "multi_seed 与 decay 仍未实现，不在这里发明通过条件。"

  budgets:
    max_cycles: 2000
    cpu_hours: 2000
    token_budget_m: 200
    deadline: "2028-10-02"

  cadence:
    survivors_per_cycle: 3
    aligned_max_points: 600
    run_budget_hours: 1.5
    quota_window_hours: 5.0
    quota_margin_min: 30
    retest_min_new_points: 1
    # 目标品种集：所有品种都需达标
    target_symbols: [m, ss, sr, cj, jd, lh, eg, rb, i, p, y, cf, bu, fu, ta, ma, fg, ur, px, oi, sh, sp, ao, sc]
