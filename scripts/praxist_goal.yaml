# Praxist goal — 2026-09-23：全品种阶段性递进目标
# Host: WSL2 Ubuntu-22.04 /home/abug/timesfm
# Policy: 每个品种都需达到 Phase 1-3 标准，确保全面质量
# 成功条件：所有目标品种均通过三阶段验证

goal:
  success_condition:
    # 所有目标品种必须满足的条件
    - "all_symbols_pass_phase1"
    - "all_symbols_pass_phase2"
    - "all_symbols_pass_phase3"
    
  phase_definitions:
    phase1:
      description: "基础质量门槛（每品种）"
      requirements:
        - "n_gate_pass_variants >= 10"
        - "avg_dir_acc_gate_pass >= 0.51"
    
    phase2:
      description: "高质量变体（每品种）"
      requirements:
        - "n_tier_a_or_b >= 8"
    
    phase3:
      description: "稳定性验证（每品种）"
      requirements:
        - "n_validated_multi_seed >= 3"
        - "decay_below_threshold <= 2"
    
  budgets:
    max_cycles: 999999
    cpu_hours: 999999
    token_budget_m: 999999
    deadline: "2099-12-31"
    
  cadence:
    survivors_per_cycle: 3
    aligned_max_points: 600
    run_budget_hours: 1.5
    quota_window_hours: 5.0
    quota_margin_min: 30
    retest_min_new_points: 1
    # 目标品种集：所有品种都需达标
    target_symbols: [m, ss, sr, cj, jd, lh, eg, rb, i, p, y, cf, bu, fu, ta, ma, fg, ur, px, oi, sh, sp, ao, sc]
